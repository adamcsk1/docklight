name: CI
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test image target selection
        run: python3 -m unittest discover -s scripts -p test_ci_targets.py
      - name: Select affected production images
        id: targets
        run: |
          targets=$(python3 scripts/ci_targets.py)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Selected production images: $targets"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test tools outside the application
        run: |
          npm install --prefix "$RUNNER_TEMP/docklight-browser" --no-save --no-package-lock playwright@1.64.1
          "$RUNNER_TEMP/docklight-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check original UI styling and responsive interactions
        env:
          NODE_PATH: ${{ runner.temp }}/docklight-browser/node_modules
          DOCKLIGHT_UI_BROWSER_TEST: '1'
        run: go test -v ./cmd/docklight -run TestBrowserPresentation -count=1 -timeout=5m
      - name: Build native images for management-update integration tests
        run: |
          docker build --target ui -t docklight:refactor .
          docker build --target agent -t docklight-agent:refactor .
      - name: Start isolated Docker test daemon
        run: |
          docker run -d --privileged --hostname docklight-isolated-test --name docklight-test-daemon -e DOCKER_TLS_CERTDIR= -p 127.0.0.1:23750:2375 docker:29-dind
          for _ in $(seq 1 60); do
            if docker --host tcp://127.0.0.1:23750 info >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs docklight-test-daemon
          exit 1
      - name: Docker integration tests (isolated daemon only)
        env:
          DOCKLIGHT_TEST_DOCKER_HOST: tcp://127.0.0.1:23750
          DOCKLIGHT_TEST_OUTER_CONTAINER: docklight-test-daemon
        run: go test -v ./internal/management -run TestDocker -count=1 -timeout=10m
      - name: Stop test daemon
        if: always()
        run: docker rm -fv docklight-test-daemon || true
  images:
    name: Build ${{ matrix.target }} (${{ matrix.platform }})
    needs: [test, changes]
    if: needs.changes.outputs.targets != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.targets) }}
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: docklight-${{ matrix.target }}:ci
      - name: Smoke-test binaries and Compose on target architecture
        run: |
          if [ '${{ matrix.target }}' = agent ]; then
            docker run --rm --platform '${{ matrix.platform }}' --entrypoint docker docklight-agent:ci compose version
            docker run --rm --platform '${{ matrix.platform }}' --entrypoint docker docklight-agent:ci buildx version
          fi
          # No credentials: both binaries must execute and fail with configuration error, not an architecture error.
          set +e
          output=$(docker run --rm --platform '${{ matrix.platform }}' docklight-${{ matrix.target }}:ci 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          echo "$output" | grep -E 'ADMIN_PASSWORD|AGENT_TOKEN'
  publish:
    needs: [images, changes]
    if: github.event_name == 'push' && needs.changes.outputs.targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.target == 'agent' && '-agent' || '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
