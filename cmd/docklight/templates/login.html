<!doctype html>
<html lang="en">
<head>{{template "head" .}}</head>
<body class="login-body">
  <main class="login-panel">
    <p class="eyebrow">docker host management</p>
    <h1>Docklight</h1>
    <p class="metric-line">Sign in to manage your Docker hosts.</p>
    {{if .Error}}<p class="alert alert-danger" role="alert">{{.Error}}</p>{{end}}
    <form class="form" method="post" action="{{.Base}}/login">
      <label><span>Admin password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button button-primary" type="submit">Login</button>
    </form>
  </main>
</body>
</html>
