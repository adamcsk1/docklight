# Create ./data/hosts.yml as shown in docs/docker.md before starting.
# Set COMPOSE_ROOT to your Linux/WSL-side absolute Compose root.
services:
  docklight:
    build:
      context: .
      target: ui
    image: docklight:dev
    labels:
      io.docklight.role: ui
    ports:
      - "127.0.0.1:7070:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      SESSION_SECRET: ${SESSION_SECRET:?required}
    volumes:
      - ./data:/data
      - ./data/hosts.yml:/data/hosts.yml:ro
    networks: [management]
  docklight-agent:
    build:
      context: .
      target: agent
    image: docklight-agent:dev
    labels:
      io.docklight.role: agent
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN:?required}
      STACKS_ROOT: ${COMPOSE_ROOT:?required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COMPOSE_ROOT:?required}:${COMPOSE_ROOT:?required}:ro
      - ./agent-data:/data
    networks: [management, outbound]
networks:
  management:
    internal: true
  outbound: {}
