services:
  docklight:
    build: .
    container_name: docklight
    mem_limit: 256m
    ports:
      - "7070:8080"
    environment:
      BASE_URL: /
      ADMIN_USER: admin
      ADMIN_PASSWORD: change-this-password
      SESSION_SECRET: replace-with-a-long-random-secret
      DOCKER_CONFIG: /root/.docker
      # Set this to the host path mounted at /stacks when they differ.
      # This keeps relative bind mounts like ./data pointed at the host stack folder.
      # STACKS_HOST_ROOT: /absolute/host/path/to/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./stacks:/stacks
      - ./data:/data
      - ./data/docker-config:/root/.docker
      # Optional: required for Config > Maintenance > Update Docklight.
      # Mount this compose project at the same absolute path used on the host.
      # - /absolute/host/path/to/docklight:/absolute/host/path/to/docklight:ro
    restart: unless-stopped
